<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="achinpp">
  <!-- Geometry matched 1:1 to scripts/generate-assets.py, so the vector and
       the raster fallbacks are the same mark. Colours are the compiled sRGB
       values of the obsidian-950 and mint-400 OKLCH tokens. (No double
       hyphens in here: XML forbids them inside a comment, so the token names
       cannot be written out.) -->
  <rect width="100" height="100" fill="#030407"/>
  <path d="M22 30 L48 50 L22 70" fill="none" stroke="#65f9c8" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="56" y="63" width="24" height="7" rx="3.5" fill="#65f9c8"/>
</svg>
